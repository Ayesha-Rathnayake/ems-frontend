<div class="'container">
    <h2>Employee List</h2>
    <button routerLink="/add-employee"> Add Employee</button>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            <tr *ngFor ="let emp of employees">
                <td>{{emp.id}}</td>
                <td>{{emp.firstName}}</td>
                <td>{{emp.lastName}}</td>
                <td>{{emp.email}}</td>

                <td>
                    <button [routerLink]="['/employee',emp.id]">View</button>
                    <button [routerLink]="['/edit-employee', emp.id]">Edit</button>
                    <button (click)="deleteEmployee(emp.id!)">Delete</button>
                </td>
            </tr>
        </tbody>
    </table>

</div>
